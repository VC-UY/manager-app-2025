# =============================================================================
# docker-compose.yml — Distributed Learning Volunteer Node
#
# Usage:
#   1. Copy .env.example to .env and edit the values
#   2. docker compose pull        # try to pull prebuilt image from Docker Hub
#   3. docker compose up -d       # start the volunteer (builds locally if pull failed)
#   4. docker compose logs -f     # follow logs
#   5. docker compose down        # stop the volunteer
#
# To run multiple volunteers on the same machine:
#   VOLUNTEER_ID=1 docker compose -p volunteer1 up -d
#   VOLUNTEER_ID=2 docker compose -p volunteer2 up -d
# =============================================================================

services:
  volunteer:
    # Image on Docker Hub (public, free)
    # Replace <your-dockerhub-username> with your actual Docker Hub username.
    image: pablo93230/distributed-learning-volunteer:latest

    # Build from local Dockerfile (fallback if image not available)
    build:
      context: .
      dockerfile: Dockerfile

    # Fichier d'environnement
    env_file:
      - .env

    # Environment
    environment:
      # REQUIRED
      - VOLUNTEER_ID=${VOLUNTEER_ID:-0}
      - COORDINATOR_HOST=${COORDINATOR_HOST}
      - MANAGER_HOST=${MANAGER_HOST}

      # OPTIONAL — all have defaults (see src/config.py)
      - N_VOLUNTEERS=${N_VOLUNTEERS:-5}
      - MY_IP=${MY_IP:-}
      - DATASET=${DATASET:-cifar10}
      - DATA_PARTITION=${DATA_PARTITION:-iid}
      - COMPRESSION=${COMPRESSION:-quantization}
      - K_NEIGHBORS=${K_NEIGHBORS:-3}
      - GOSSIP_INTERVAL=${GOSSIP_INTERVAL:-60}
      - GOSSIP_FANOUT=${GOSSIP_FANOUT:-1}
      - LOCAL_EPOCHS=${LOCAL_EPOCHS:-1}
      - MODEL_NAME=${MODEL_NAME:-resnet18}
      - BATCH_SIZE=${BATCH_SIZE:-32}
      - LEARNING_RATE=${LEARNING_RATE:-0.001}
      - NUM_CLASSES=${NUM_CLASSES:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - STATS_DIR=${STATS_DIR:-/app/results}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-30}
      - HEARTBEAT_TIMEOUT=${HEARTBEAT_TIMEOUT:-90}
      - SOCKET_TIMEOUT=${SOCKET_TIMEOUT:-300}
      - ALLOW_DATASET_DOWNLOAD=${ALLOW_DATASET_DOWNLOAD:-0}

      # AD-PSGD
      - ADPSGD_ENABLED=${ADPSGD_ENABLED:-true}
      - ADPSGD_TOPOLOGY=${ADPSGD_TOPOLOGY:-exponential}
      - ADPSGD_ROLE=${ADPSGD_ROLE:-auto}
      - ADPSGD_ALPHA=${ADPSGD_ALPHA:-0.5}

      # OPTIONAL — hardware hints (advertised to coordinator)
      - CPU_CORES=${CPU_CORES:-}
      - RAM_GB=${RAM_GB:-}
      - NETWORK_MBPS=${NETWORK_MBPS:-}

    # Volumes
    # Persist results outside the container
    volumes:
      - ./results:/app/results:rw

    # Network
    # Use host network so the volunteer can reach coordinator/manager
    # and they can reach it by its real IP.
    network_mode: host

    # Shared memory size for PyTorch DataLoader (default is 64MB, which is too small)
    shm_size: '2gb'

    # Give the volunteer time to finish current batch + save stats before SIGKILL
    stop_grace_period: 30s

    # Disable auto-restart so container stops when training rounds limit is reached
    restart: "no"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:1.6.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.40
    command: --interval 300 --label-enable --cleanup
    restart: unless-stopped
